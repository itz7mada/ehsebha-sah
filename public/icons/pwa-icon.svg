<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Ehsebha Sah app icon">
  <defs>
    <linearGradient id="bg" x1="160" y1="80" x2="880" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D7A06F"/>
      <stop offset="0.52" stop-color="#C99368"/>
      <stop offset="1" stop-color="#B87850"/>
    </linearGradient>
    <radialGradient id="glow" cx="34%" cy="20%" r="72%">
      <stop offset="0" stop-color="#F0C39A" stop-opacity="0.55"/>
      <stop offset="0.56" stop-color="#D39B6B" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8F5739" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6C3F2C" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <g filter="url(#softShadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- open circular gesture: completion / planning loop -->
    <path d="M646 238 C548 178 405 191 309 287 C192 404 188 592 301 704 C397 800 548 819 666 753" stroke="#FFF7EB" stroke-width="92"/>
    <!-- check mark: correct calculation -->
    <path d="M383 521 L501 640 L720 383" stroke="#FFF7EB" stroke-width="104"/>
  </g>
  <!-- single dark point: final confirmation / calculated mark -->
  <circle cx="736" cy="651" r="38" fill="#152238"/>
</svg>
